{% extends "Bare.html" %}
{% set disable_auto_start = True %}

{% block main %}

{% include app_or_default(app, "JustPOSTInfo.html") ignore missing %}

{% endblock main %}

{% block late %}

<script>
    if (typeof stopHere === "undefined" || !stopHere) {
        uproot.onStart(() => {
            const form = document.forms[0];
            const label = new URLSearchParams(window.location.search).get("label");

            if (label !== null) {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = "label";
                input.value = label;
                form.appendChild(input);
            }

            form.action = window.location.pathname + window.location.search;
            uproot.submitForm(form);
        });
    }
</script>

{% endblock late %}
