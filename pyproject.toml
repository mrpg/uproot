[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uproot-science"
version = "0.4.0"
description = "A modern experimental framework"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
{name = "Max R. P. Grossmann", email = "max@uproot.science"},
{name = "Holger Gerhardt", email = "holger@uproot.science"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "appendmuch>=0.1.1,<0.2",
    "click>=8.4.2,<9",
    "fastapi>=0.136.3,<1",
    "itsdangerous>=2.2.0,<3",
    "jinja2>=3.1.6,<4",
    "mistune>=3.3.2,<4",
    "orjson>=3.11.8,<4",
    "packaging>=24,<27",
    "pydantic>=2.13.4,<3",
    "strictyaml>=1.7.3,<2",
    "python-dotenv>=1.2.2,<2",
    "python-multipart>=0.0.32,<0.1",
    "setproctitle>=1.3.7,<2",
    "sortedcontainers>=2.4.0,<3",
    "uvicorn>=0.49.0,<1",
    "watchdog>=6.0.0,<7",
    "websockets>=16.0,<18",
    "wtforms>=3.2.2,<4",
]

[tool.uv]
# exclude-newer = "8 days"
python-preference = "system"

[project.urls]
Homepage = "https://uproot.science/"
Repository = "https://github.com/mrpg/uproot"

[project.scripts]
uproot = "uproot.defaultcli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uproot = ["default/**/*", "_static/**/*", "py.typed"]

[tool.black]
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | tests
)/
'''

[tool.ruff]
src = ["src"]
exclude = ["build", "dist", ".venv", "venv", ".git", "__pycache__", "tests"]

[tool.ruff.lint]
ignore = ["I"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src"]
skip = ["tests", "build", "dist", ".venv", "venv"]

[project.optional-dependencies]
pg = [
    "appendmuch[pg]>=0.1.0,<0.2",
]
dev = [
    "bandit",
    "black",
    "deptry",
    "isort",
    "mypy",
    "pip-tools",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "radon",
    "ruff",
    "twine",
]
iban = [
    "schwifty>=2026.3.0,<2027"
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = false  # can be reenabled later, there is a bug here with the CI
no_implicit_optional = true
disallow_any_generics = true
check_untyped_defs = true
strict_equality = true
exclude = ["tests", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=uproot --cov-report=term-missing"
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", "build", ".venv", "venv"]
skips = []

[tool.deptry]
extend_exclude = ["tests", "build"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "setuptools",
    "wheel",
    # Dev tools not imported in code
    "bandit",
    "black",
    "deptry",
    "isort",
    "mypy",
    "pip-tools",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "radon",
    "ruff",
    # Runtime dependencies not directly imported
    "python-multipart",  # Required by FastAPI for form data
    "twine",  # Used for publishing
    "websockets",  # Required for WebSocket support
]
DEP003 = [
    "uproot",  # Internal package imports
    "markupsafe",  # Jinja2 transitive dependency
    "typing_extensions",  # Pydantic transitive dependency
    "starlette",  # FastAPI transitive dependency
]
DEP001 = [
    "main",  # Not a package, used for __name__ == '__main__'
]
